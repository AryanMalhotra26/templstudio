  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="342" cy="108" r="326" fill="url(#key)"/>
  <circle cx="419" cy="451" r="228" fill="url(#rim)"/>
  <circle cx="298" cy="624" r="179" fill="url(#kiss)"/>
  <rect y="595" width="640" height="205" fill="url(#floor)"/>
  <path d="M0 595H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="286" cy="260" rx="98" ry="120"/>
    <path d="M-185 800
             C-185 407
              154 407
              286 400
             C419 407
              757 407
              757 800Z"/>
