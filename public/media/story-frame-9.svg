  <rect width="720" height="960" fill="url(#wall)"/>
  <circle cx="248" cy="106" r="296" fill="url(#key)"/>
  <circle cx="562" cy="393" r="207" fill="url(#rim)"/>
  <circle cx="472" cy="749" r="163" fill="url(#kiss)"/>
  <rect y="580" width="720" height="380" fill="url(#floor)"/>
  <path d="M0 580H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="424" cy="419" rx="135" ry="164"/>
    <path d="M-2 960
