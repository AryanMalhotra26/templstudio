    <pattern id="grain" width="65" height="65" patternUnits="userSpaceOnUse" patternTransform="rotate(10.1)">
      <path d="M0 0H65M0 0V65" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
