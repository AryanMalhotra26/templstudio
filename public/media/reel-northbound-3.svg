  <rect width="720" height="1280" fill="url(#wall)"/>
  <circle cx="489" cy="511" r="423" fill="url(#key)"/>
  <circle cx="595" cy="417" r="296" fill="url(#rim)"/>
  <circle cx="231" cy="998" r="232" fill="url(#kiss)"/>
  <rect y="890" width="720" height="390" fill="url(#floor)"/>
  <path d="M0 890H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="425" cy="529" rx="131" ry="160"/>
    <path d="M-31 1280
