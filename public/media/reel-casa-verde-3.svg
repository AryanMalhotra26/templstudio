  <circle cx="491" cy="650" r="238" fill="url(#rim)"/>
  <circle cx="565" cy="998" r="187" fill="url(#kiss)"/>
  <rect y="836" width="720" height="444" fill="url(#floor)"/>
  <path d="M0 836H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

