<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="a14500bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <radialGradient id="a14500key">
      <stop offset="0" stop-color="#eae9e6" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#eae9e6" stop-opacity="0.28"/>
