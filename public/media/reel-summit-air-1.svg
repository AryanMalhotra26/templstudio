  <rect width="720" height="1280" fill="url(#wall)"/>
  <circle cx="138" cy="471" r="316" fill="url(#key)"/>
  <circle cx="612" cy="793" r="221" fill="url(#rim)"/>
  <circle cx="582" cy="998" r="174" fill="url(#kiss)"/>
  <rect y="768" width="720" height="512" fill="url(#floor)"/>
  <path d="M0 768H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="339" cy="449" rx="132" ry="161"/>
    <path d="M-163 1280
