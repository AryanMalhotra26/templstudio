<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#8d918a"/>
      <stop offset="0.55" stop-color="#4c5049"/>
      <stop offset="1" stop-color="#1e201c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="key">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim">
      <stop offset="0" stop-color="#ecfdad" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ecfdad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kiss">
