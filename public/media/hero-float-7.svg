    <pattern id="grain" width="58" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(-13.0)">
      <path d="M0 0H58M0 0V58" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
