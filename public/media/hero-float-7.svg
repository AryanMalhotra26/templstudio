  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="347" cy="194" r="391" fill="url(#key)"/>
  <circle cx="604" cy="491" r="273" fill="url(#rim)"/>
  <circle cx="293" cy="624" r="215" fill="url(#kiss)"/>
  <rect y="515" width="640" height="285" fill="url(#floor)"/>
  <path d="M0 515H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="414" cy="249" rx="97" ry="118"/>
    <path d="M-13 800
