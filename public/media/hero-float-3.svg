  <rect width="640" height="800" fill="url(#a1111bg)"/>
  <circle cx="363" cy="186" r="357" fill="url(#a1111key)"/>
  <circle cx="563" cy="705" r="319" fill="url(#a1111wash)"/>
  <g mask="url(#a1111dm)">
