<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="a1111bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0c1a15"/>
      <stop offset="1" stop-color="#112620"/>
    </linearGradient>
    <radialGradient id="a1111key">
      <stop offset="0" stop-color="#ba9b5f" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ba9b5f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ba9b5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1111wash">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a1111dotmask">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="a1111dm">
      <rect width="640" height="800" fill="url(#a1111dotmask)"/>
    </mask>
    <pattern id="a1111dots" width="7" height="7" patternUnits="userSpaceOnUse">
