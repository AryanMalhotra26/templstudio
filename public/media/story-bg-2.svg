  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="425" cy="287" r="376" fill="url(#key)"/>
  <circle cx="480" cy="227" r="263" fill="url(#rim)"/>
  <circle cx="215" cy="624" r="207" fill="url(#kiss)"/>
  <rect y="566" width="640" height="234" fill="url(#floor)"/>
  <path d="M0 566H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
