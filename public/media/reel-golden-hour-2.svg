  <rect width="720" height="1280" fill="url(#wall)"/>
  <circle cx="475" cy="344" r="377" fill="url(#key)"/>
  <circle cx="619" cy="430" r="264" fill="url(#rim)"/>
  <circle cx="245" cy="998" r="207" fill="url(#kiss)"/>
  <rect y="921" width="720" height="359" fill="url(#floor)"/>
  <path d="M0 921H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

