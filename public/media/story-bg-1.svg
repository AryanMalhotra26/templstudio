  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="412" cy="96" r="386" fill="url(#key)"/>
  <circle cx="493" cy="482" r="270" fill="url(#rim)"/>
  <circle cx="228" cy="624" r="212" fill="url(#kiss)"/>
  <rect y="567" width="640" height="233" fill="url(#floor)"/>
  <path d="M0 567H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="256" cy="334" rx="102" ry="124"/>
    <path d="M-192 800
