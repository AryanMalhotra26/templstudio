  <rect width="720" height="1280" fill="url(#wall)"/>
  <circle cx="153" cy="253" r="361" fill="url(#key)"/>
  <circle cx="588" cy="780" r="253" fill="url(#rim)"/>
  <circle cx="567" cy="998" r="199" fill="url(#kiss)"/>
  <rect y="942" width="720" height="338" fill="url(#floor)"/>
  <path d="M0 942H720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
