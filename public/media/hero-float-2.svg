  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="324" cy="247" r="262" fill="url(#key)"/>
  <circle cx="578" cy="290" r="183" fill="url(#rim)"/>
  <circle cx="316" cy="624" r="144" fill="url(#kiss)"/>
  <rect y="534" width="640" height="266" fill="url(#floor)"/>
  <path d="M0 534H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="351" cy="306" rx="105" ry="128"/>
    <path d="M-38 800
