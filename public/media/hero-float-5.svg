  <rect width="640" height="800" fill="url(#wall)"/>
  <circle cx="338" cy="263" r="262" fill="url(#key)"/>
  <circle cx="459" cy="411" r="184" fill="url(#rim)"/>
  <circle cx="302" cy="624" r="144" fill="url(#kiss)"/>
  <rect y="548" width="640" height="252" fill="url(#floor)"/>
  <path d="M0 548H640" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <g fill="url(#subject)">
    <ellipse cx="351" cy="272" rx="100" ry="122"/>
    <path d="M-36 800
             C-36 421
              216 421
              351 413
             C485 421
              737 421
              737 800Z"/>
